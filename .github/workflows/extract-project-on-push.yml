name: Extract Artha Market project ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.event.head_commit.message != 'Extract Artha Market project files' && hashFiles('grok-workspace.zip') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract project files
        run: |
          unzip -o grok-workspace.zip -d .
          rm -f grok-workspace.zip
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract Artha Market project files"
          git push
