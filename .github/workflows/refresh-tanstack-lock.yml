name: Repair TanStack security lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-tanstack-lock.yml"

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update patched TanStack dependencies and lockfile
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.dependencies ??= {};
          pkg.dependencies['@tanstack/react-start'] = '^1.168.60';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify patched versions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const reactStart = lock.packages['node_modules/@tanstack/react-start']?.version;
          const serverCore = lock.packages['node_modules/@tanstack/start-server-core']?.version;
          console.log({ reactStart, serverCore });
          const version = value => value?.split('.').map(Number) ?? [];
          const atLeast = (value, required) => {
            const a = version(value), b = version(required);
            for (let i = 0; i < 3; i++) if ((a[i] ?? 0) !== (b[i] ?? 0)) return (a[i] ?? 0) > (b[i] ?? 0);
            return true;
          };
          if (!atLeast(reactStart, '1.168.60') || !atLeast(serverCore, '1.169.39')) {
            throw new Error('Patched TanStack versions are not resolved in package-lock.json');
          }
          NODE
      - name: Commit repaired dependency files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-tanstack-lock.yml
          git add package.json package-lock.json
          git commit -m "fix: patch TanStack Start XSS vulnerability"
          git push origin HEAD:main
